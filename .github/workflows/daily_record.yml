name: Daily Market History Scraper

on:
  schedule:
    # 毎日 UTC 15:00 (JST 0:00) に実行
    - cron: '0 15 * * *'
    # 毎日 UTC 3:00 (JST 12:00) に実行
    - cron: '0 3 * * *'
  workflow_dispatch: # 手動実行用

jobs:
  scrape-and-record:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas urllib3

    - name: Run scraper
      run: python record_history.py

    - name: Commit and push if changed
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add history.csv
        git commit -m "Automated daily market history update" || exit 0
        git push
